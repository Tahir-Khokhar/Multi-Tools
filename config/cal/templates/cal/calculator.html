{% extends "base.html" %}
{% load static %}
{% block title %}Scientific Calculator{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="{% static 'cal/calculator.css' %}">
{% endblock %}
{% block content %}
<div id="calculator-section" class="app-section active">
    <div class="card" style="background: #1e293b; border-radius: 1rem; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);">
        <h2 style="margin-bottom: 1.5rem; color: #60a5fa;"><i class="fas fa-calculator"></i> Scientific Calculator</h2>
        <div class="calc-display" style="background: #0f172a; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem;">
            <div id="calc-expression" style="color: #94a3b8; font-size: 1.2rem; text-align: right; min-height: 1.5rem;"></div>
            <div id="calc-result" style="color: #fff; font-size: 2.5rem; text-align: right; font-weight: 700;">0</div>
        </div>
        <div class="calc-buttons" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.75rem;">
            <button class="calc-btn func" onclick="calcInput('sin')">sin</button>
            <button class="calc-btn func" onclick="calcInput('cos')">cos</button>
            <button class="calc-btn func" onclick="calcInput('tan')">tan</button>
            <button class="calc-btn func" onclick="calcInput('sqrt')">sqrt</button>
            <button class="calc-btn func" onclick="calcInput('log')">log</button>
            <button class="calc-btn func" onclick="calcInput('factorial')">x!</button>
            <button class="calc-btn func" onclick="calcInput('pow')">x^y</button>
            <button class="calc-btn func" onclick="calcInput('(')">(</button>
            <button class="calc-btn func" onclick="calcInput(')')">)</button>
            <button class="calc-btn op" onclick="calcOp('/')">/</button>
            <button class="calc-btn op" onclick="calcOp('*')">x</button>
            <button class="calc-btn op" onclick="calcOp('-')">-</button>
            <button class="calc-btn clear" onclick="calcClear()">C</button>
            <button class="calc-btn op" onclick="calcOp('+')">+</button>
            <button class="calc-btn num" onclick="calcInput('7')">7</button>
            <button class="calc-btn num" onclick="calcInput('8')">8</button>
            <button class="calc-btn num" onclick="calcInput('9')">9</button>
            <button class="calc-btn const" onclick="calcInput('pi')">PI</button>
            <button class="calc-btn const" onclick="calcInput('e')">e</button>
            <button class="calc-btn num" onclick="calcInput('4')">4</button>
            <button class="calc-btn num" onclick="calcInput('5')">5</button>
            <button class="calc-btn num" onclick="calcInput('6')">6</button>
            <button class="calc-btn point" onclick="calcInput('.')">.</button>
            <button class="calc-btn equal" onclick="calcEqual()" style="grid-column: span 3;">=</button>
            <button class="calc-btn num" onclick="calcInput('1')">1</button>
            <button class="calc-btn num" onclick="calcInput('2')">2</button>
            <button class="calc-btn num" onclick="calcInput('3')">3</button>
            <button class="calc-btn num" onclick="calcInput('0')">0</button>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{% static 'cal/calculator.js' %}"></script>
{% endblock %}
