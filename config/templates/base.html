<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MultiTool Playground{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <h1><i class="fas fa-layer-group"></i> MultiTool</h1>
        <div class="nav-links">
            <a href="/cal/" class="nav-item" data-target="calculator-section"><i class="fas fa-calculator"></i> Calculator</a>
            <a href="/alm/" class="nav-item" data-target="alarm-section"><i class="fas fa-clock"></i> Alarm</a>
            <a href="/sng/" class="nav-item" data-target="snake-section"><i class="fas fa-gamepad"></i> Snake</a>
            <a href="/dio/" class="nav-item" data-target="dino-section"><i class="fas fa-dragon"></i> Dino</a>
        </div>
    </nav>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
    {% block extra_scripts %}{% endblock %}
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    navItems.forEach(n => n.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
